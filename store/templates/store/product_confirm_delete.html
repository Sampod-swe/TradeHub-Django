{% extends 'store/base.html.html' %}

{% block content %}
<div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow-sm border-danger">
        <div class="card-body text-center p-4">
            <i class="bi bi-exclamation-triangle-fill text-danger display-4 mb-3"></i>
            <h4 class="fw-bold mb-3">আপনি কি নিশ্চিত?</h4>
            <p class="text-muted">
                আপনি <strong>"{{ product.title }}"</strong> প্রোডাক্টটি মুছে ফেলতে যাচ্ছেন। এই কাজটি আর ফেরানো যাবে না।
            </p>
            <form method="POST" class="mt-4">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-2">
                    <button type="submit" class="btn btn-danger px-4">হ্যাঁ, ডিলিট করুন</button>
                    <a href="{% url 'store:dashboard' %}" class="btn btn-outline-secondary px-4">বাতিল</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
